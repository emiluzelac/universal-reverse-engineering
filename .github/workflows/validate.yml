name: validate
# Pull requests opened on GitHub only. Since 2026-11-15 the canonical repository
# and its checks are on our own (private) Forgejo (.forgejo/workflows/validate.yml),
# which mirrors every push here; this keeps the check for an outside
# contributor's pull request, on GitHub-hosted runners.
on:
  pull_request:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install skills-ref
      - run: tests/smoke.sh reverse-engineering
